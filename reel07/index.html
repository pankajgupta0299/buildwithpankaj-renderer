<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guess The Score · BuildWithPankaj</title>
<style>
 :root{font-family:system-ui,Arial,sans-serif;color:#f9f9f0;background:#141612}*{box-sizing:border-box}body{margin:0;padding:24px 15px}.wrap{max-width:650px;margin:auto}.kicker{color:#d5d79c;letter-spacing:.15em;font-weight:900;font-size:12px}h1{font-size:clamp(40px,9vw,68px);line-height:.99;letter-spacing:-.05em;margin:22px 0}p{line-height:1.45;color:#ddd}.stage{border:2px solid #6b6f2a;background:#22251d;border-radius:24px;padding:24px;margin-top:28px}label{display:block;font-size:20px;font-weight:800;margin:18px 0 9px}select,input,button{width:100%;padding:17px;border-radius:14px;font:inherit;font-size:18px}select,input{color:#fff;background:#33382a;border:1px solid #6b6f2a}button{border:0;background:#ced879;color:#202020;font-weight:900;margin-top:20px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid white}.score{display:flex;justify-content:center;align-items:center;gap:12px;margin:24px 0}.score span{display:inline-grid;place-items:center;width:68px;height:76px;border:2px solid #ced879;border-radius:15px;font-size:34px;font-weight:900}.big{font-size:66px;font-weight:1000;color:#e0e9a0;line-height:1}.result{min-height:190px;border-radius:16px;background:#303626;padding:20px;margin-top:25px}.muted{font-size:13px;color:#b6b8ad;margin-top:25px}
</style>
<main class="wrap"><div class="kicker">BUILDWITHPANKAJ / ORIGINAL MINI GAME</div><h1>तुम्हारा<br>टैलेंट कितने नंबर?</h1><p>एक मज़ेदार काल्पनिक एक्ट चुनो, अपना स्कोर बताओ, फिर देखो तीन काल्पनिक जज क्या कहते हैं।</p><form id="game" class="stage"><label for="act">अपना टैलेंट चुनो</label><select id="act"></select><label for="guess">तुम्हारा अनुमान (0–10)</label><input id="guess" type="number" min="0" max="10" step="1" value="9" required><button type="submit">जजों का स्कोर दिखाओ →</button><section class="result" id="result" aria-live="polite">अपना अनुमान लगाकर बटन दबाओ।</section></form><div class="muted">एक स्वतंत्र प्रेरित प्रयोग। शो से संबद्ध नहीं। जज और स्कोर काल्पनिक हैं; रनटाइम पर कोई AI निर्णय नहीं होता।</div></main>
<script type="module">
import {acts,judge} from './model.mjs';
const select=document.getElementById('act');for(const act of acts){const option=document.createElement('option');option.value=act.id;option.textContent=act.label;select.append(option)}
document.getElementById('game').addEventListener('submit',event=>{event.preventDefault();const p=judge(select.value,document.getElementById('guess').value);const result=document.getElementById('result');result.replaceChildren();const lead=document.createElement('div');lead.textContent=`तुमने कहा: ${p.guess}/10`;const row=document.createElement('div');row.className='score';for(const score of p.scores){const s=document.createElement('span');s.textContent=score;row.append(s)}const outcome=document.createElement('div');outcome.className='big';outcome.textContent=`औसत: ${p.average}/10`;const reply=document.createElement('p');reply.textContent=(p.match?'वाह! बिल्कुल सही अनुमान। ':`अरे! ${p.difference} अंक से चूक गए। `)+p.reaction;result.append(lead,row,outcome,reply)});
</script></html>
