name: Render Reel
on:
  workflow_dispatch:
  push:
    paths:
      - "content.json"
permissions:
  contents: read
  id-token: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_MEDIA_BASE_URL: ${{ secrets.PRIVATE_MEDIA_BASE_URL }}
      PRIVATE_MEDIA_TOKEN: ${{ secrets.PRIVATE_MEDIA_TOKEN }}
      GOOGLE_CLOUD_PROJECT_ID: project-f4392ec4-4015-402b-9b8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate public content spec
        run: npm run validate
      - name: Resolve private media
        run: npm run resolve-media
      - name: Check whether Google TTS is requested
        id: tts
        shell: bash
        run: |
          NEED=$(node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('resolved-content.json','utf8')); process.stdout.write(String(Boolean((c.voiceoverText||'').trim() || c.scenes?.some(s => (s.voiceText||'').trim()))))")
          echo "needed=$NEED" >> "$GITHUB_OUTPUT"
      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: steps.tts.outputs.needed == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/255048172420/locations/global/workloadIdentityPools/github-actions/providers/buildwithpankaj-github
          service_account: buildwithpankaj-tts@project-f4392ec4-4015-402b-9b8.iam.gserviceaccount.com
          create_credentials_file: true
      - name: Set up Google Cloud CLI
        if: steps.tts.outputs.needed == 'true'
        uses: google-github-actions/setup-gcloud@v3
      - name: Generate Google Cloud TTS voiceover
        if: steps.tts.outputs.needed == 'true'
        run: node scripts/generate-google-tts.mjs
      - name: Generate original royalty-free music when requested
        run: |
          MODE=$(node -p "require('./content.json').musicMode || ''")
          if [ "$MODE" = "generated-original" ]; then
            mkdir -p public
            DURATION=$(node -e "const c=require('./resolved-content.json'); console.log(c.scenes.reduce((s,x)=>s+x.durationFrames,0)/30)")
            STYLE=$(node -p "require('./content.json').musicStyle || 'default'")
            python3 scripts/generate-original-music.py public/generated-music.wav "$DURATION" "$STYLE"
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('resolved-content.json','utf8')); if (p.audioSrc) p.musicSrc='generated-music.wav'; else p.audioSrc='generated-music.wav'; fs.writeFileSync('resolved-content.json',JSON.stringify(p,null,2));"
          fi
      - name: Render 1080x1920 Reel
        run: |
          mkdir -p out
          START=$(date +%s)
          npm run render:spec
          END=$(date +%s)
          echo "render_seconds=$((END-START))" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out/reel.mp4 >> "$GITHUB_STEP_SUMMARY"
      - name: Store rendered draft privately in R2
        env:
          DRAFT_KEY: draft-run-${{ github.run_id }}.mp4
        run: |
          curl --fail-with-body --silent --show-error \
            -X PUT "${PRIVATE_MEDIA_BASE_URL}/media/${DRAFT_KEY}" \
            -H "Authorization: Bearer ${PRIVATE_MEDIA_TOKEN}" \
            -H "Content-Type: video/mp4" \
            --data-binary @out/reel.mp4
          curl --fail-with-body --silent --show-error \
            -I "${PRIVATE_MEDIA_BASE_URL}/media/${DRAFT_KEY}" \
            -H "Authorization: Bearer ${PRIVATE_MEDIA_TOKEN}"
          echo "private_draft_key=${DRAFT_KEY}" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove local private inputs and output
        if: always()
        run: rm -rf public/private-media resolved-content.json out/reel.mp4
