name: Render Reel
on:
  workflow_dispatch:
  push:
    paths:
      - "content.json"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_MEDIA_BASE_URL: ${{ secrets.PRIVATE_MEDIA_BASE_URL }}
      PRIVATE_MEDIA_TOKEN: ${{ secrets.PRIVATE_MEDIA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate public content spec
        run: npm run validate
      - name: Resolve private media
        run: npm run resolve-media
      - name: Render 1080x1920 Reel
        run: |
          mkdir -p out
          START=$(date +%s)
          npm run render:spec
          END=$(date +%s)
          echo "render_seconds=$((END-START))" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out/reel.mp4 >> "$GITHUB_STEP_SUMMARY"
      - name: Store rendered draft privately in R2
        env:
          DRAFT_KEY: draft-run-${{ github.run_id }}.mp4
        run: |
          curl --fail-with-body --silent --show-error \
            -X PUT "${PRIVATE_MEDIA_BASE_URL}/media/${DRAFT_KEY}" \
            -H "Authorization: Bearer ${PRIVATE_MEDIA_TOKEN}" \
            -H "Content-Type: video/mp4" \
            --data-binary @out/reel.mp4
          curl --fail-with-body --silent --show-error \
            -I "${PRIVATE_MEDIA_BASE_URL}/media/${DRAFT_KEY}" \
            -H "Authorization: Bearer ${PRIVATE_MEDIA_TOKEN}"
          echo "private_draft_key=${DRAFT_KEY}" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove local private inputs and output
        if: always()
        run: rm -rf public/private-media resolved-content.json out/reel.mp4
