name: Render Benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - "benchmark-trigger.txt"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Render 30s 1080x1920 benchmark
        run: |
          mkdir -p out
          START=$(date +%s)
          npm run render
          END=$(date +%s)
          echo "render_seconds=$((END-START))" >> "$GITHUB_STEP_SUMMARY"
          ls -lh out/benchmark.mp4 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark MP4
        uses: actions/upload-artifact@v4
        with:
          name: buildwithpankaj-benchmark
          path: out/benchmark.mp4
          retention-days: 1
