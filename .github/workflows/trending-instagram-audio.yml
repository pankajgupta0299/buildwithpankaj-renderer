name: Discover Trending Instagram Audio
on:
  workflow_dispatch:
  push:
    paths:
      - "trending-audio-trigger.txt"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch Meta trending licensed music for BuildWithPankaj
        run: node scripts/trending-instagram-audio.mjs music
